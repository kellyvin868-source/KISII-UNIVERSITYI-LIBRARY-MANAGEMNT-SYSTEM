components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: token

  responses:
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated member is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        isbn:
          type: string
        description:
          type: string
        availableCopies:
          type: integer
        totalCopies:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]

    BookInput:
      type: object
      required: [title, authorId, categoryId, isbn, totalCopies]
      properties:
        title:
          type: string
        authorId:
          type: string
        categoryId:
          type: string
        isbn:
          type: string
        description:
          type: string
        totalCopies:
          type: integer
          minimum: 0

    CurrentMember:
