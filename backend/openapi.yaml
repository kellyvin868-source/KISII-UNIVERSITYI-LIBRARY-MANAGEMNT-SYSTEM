        id:
          type: string
        fname:
          type: string
        lname:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [MEMBER, LIBRARIAN, ADMIN]

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Author:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    AuthorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Member:
      type: object
      properties:
        id:
          type: string
        fname:
          type: string
        lname:
          type: string
        regNo:
          type: string
        email:
          type: string
        phone:
          type: string
        memberType:
          type: string
